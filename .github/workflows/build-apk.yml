# TRANS — Build the native public Android APK and publish it as a Release asset.
#
# Native Kotlin build (no web view, no Capacitor). Public flavour: no keys
# are baked in — the user enters their own Deepgram + Groq keys in Settings.
#
# Fixed signing: the APK is signed with the shared TRANS release keystore,
# whose base64 lives in the ANDROID_KEYSTORE_BASE64 Secret (see the
# signing README in the old live-translator project). The workflow fails
# fast if the keystore Secrets are missing. versionName comes from the
# tag input (default v1.0.0); versionCode comes from the GitHub run
# number, so it rises on every build and updates install over the old APK.
#
# Triggers: pushing app code / build files to main, or manual Run workflow.
# The APK is a signed release build — install it by allowing installs from
# unknown sources.

name: Build TRANS APK (public)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check signing Secrets are set
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] || [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "::error::Missing Android signing Secrets (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD). Set them at Settings → Secrets and variables → Actions in this repo, then re-run this workflow."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/trans-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/trans-release.keystore" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew runUnitTests --no-daemon

      - name: Build signed public APK
        env:
          VERSION_NAME: ${{ inputs.tag || 'v1.0.0' }}
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assemblePublicRelease --no-daemon

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || 'v1.0.0' }}"
          APK="app/build/outputs/apk/public/release/TRANS-public-v${TAG#v}.apk"
          ls -la "$APK"
          NOTES="Native TRANS $TAG (public, Kotlin). No API keys are included — enter your own Deepgram + Groq keys in Settings after installing. Signed with the fixed release keystore: updates install over the previous build and keep history. Install by allowing installs from unknown sources. Live use needs a VPN in mainland China; see README."
          gh release create "$TAG" --title "TRANS $TAG (public)" --notes "$NOTES" "$APK" \
            || gh release upload "$TAG" --clobber "$APK"
